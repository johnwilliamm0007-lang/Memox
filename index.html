<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Coinfolio — Crypto Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#090b14;--panel:rgba(255,255,255,.055);--border:rgba(255,255,255,.09);--text:#f4f6ff;--muted:#9299b2;--green:#55f2b1;--red:#ff6b85;--purple:#9b8cff;--blue:#6ba9ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 5% 0%,rgba(95,76,210,.20),transparent 36%),radial-gradient(ellipse at 100% 20%,rgba(29,155,130,.12),transparent 32%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh;font-size:14px}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.app{max-width:1440px;margin:auto;padding:28px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:23px;font-weight:800;color:#10131b;background:linear-gradient(135deg,#8c80ff,#5bf3c0);box-shadow:0 8px 30px #8c80ff35}
.brand h1{font-size:20px;margin:0;letter-spacing:-.7px}.brand p{font-size:11px;color:var(--muted);margin:4px 0 0}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#62697e}.dot.live{background:var(--green);box-shadow:0 0 12px #55f2b188}
.btn{border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);padding:11px 15px;border-radius:12px;font-weight:600;transition:.2s}.btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#9b8cff,#6c78ff);border:0;color:white}.btn.danger{color:var(--red)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:20px 0 24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--green);font-weight:700}.hero h2{font-size:clamp(26px,4vw,38px);letter-spacing:-1.6px;margin:10px 0}.hero p{color:var(--muted);margin:0;line-height:1.7}
.panel{background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--border);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px #00000015}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}.stat{padding:22px;min-width:0;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-38px;top:-48px;background:var(--glow,rgba(155,140,255,.1));filter:blur(8px)}
.stat-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.stat-value{font-size:clamp(20px,2.6vw,30px);font-weight:800;letter-spacing:-1px;margin:15px 0 9px;overflow-wrap:anywhere}.stat-foot{font-size:12px;color:var(--muted);line-height:1.6}.green{color:var(--green)!important}.red{color:var(--red)!important}
.two-col{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px;margin-bottom:18px}.section{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.section-head h3{margin:0;font-size:16px;letter-spacing:-.4px}.section-head p{margin:6px 0 0;color:var(--muted);font-size:12px}
.badge{padding:7px 10px;border-radius:10px;background:#55f2b115;color:var(--green);font-size:11px;font-weight:700;white-space:nowrap}.chart-wrap{height:180px;position:relative}canvas{width:100%;height:100%;display:block}
.rate-card{padding:18px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--border);margin-bottom:12px}.rate-label{color:var(--muted);font-size:12px}.rate-number{font-size:25px;font-weight:800;margin:10px 0;overflow-wrap:anywhere}.rate-note{color:var(--muted);font-size:11px;line-height:1.6}
.asset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.asset-card{padding:18px;min-width:0;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}.asset-card:hover{transform:translateY(-3px);border-color:#9b8cff70}
.asset-top{display:flex;align-items:center;gap:11px;min-width:0}.coin-logo{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--border);font-weight:800;font-size:13px;overflow:hidden}.coin-logo img{width:100%;height:100%;object-fit:cover}
.coin-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.coin-symbol{color:var(--muted);font-size:11px;margin-top:5px}.asset-price{margin:21px 0 5px;font-size:23px;font-weight:800;letter-spacing:-.7px;overflow-wrap:anywhere}.asset-change{font-size:12px;font-weight:600}
.asset-details{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}.asset-details strong{display:block;color:var(--text);font-size:12px;margin-top:5px;overflow-wrap:anywhere}.asset-buttons{display:flex;gap:7px;margin-top:14px}.asset-buttons .btn{padding:8px 10px;font-size:11px;flex:1}
.table-panel{padding:22px;margin-bottom:20px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.search{background:#ffffff08;color:var(--text);border:1px solid var(--border);padding:11px 13px;border-radius:11px;min-width:180px}.search::placeholder,input::placeholder{color:#777f99}
.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:780px;text-align:left}th{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;padding:14px 12px;border-bottom:1px solid var(--border)}td{padding:15px 12px;border-bottom:1px solid #ffffff09;font-size:12px;white-space:nowrap}tbody tr:hover{background:#ffffff04}tbody tr:last-child td{border-bottom:0}
.coin-cell{display:flex;align-items:center;gap:10px}.coin-cell .coin-logo{width:35px;height:35px;flex-basis:35px;font-size:10px}.coin-cell .coin-name{font-size:12px}.coin-cell .coin-symbol{font-size:10px}.small-action{border:1px solid var(--border);background:#ffffff08;color:var(--text);border-radius:8px;padding:7px 9px;margin-right:4px}
.empty{text-align:center;padding:35px 20px;color:var(--muted);line-height:1.8}.empty-icon{font-size:35px;margin-bottom:12px}.footer{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font
